version: '3.8'

services:
  user-db:
    image: postgres:15-alpine
    container_name: user-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - ensam-network

  academic-db:
    image: postgres:15-alpine
    container_name: academic-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - academic-db-data:/var/lib/postgresql/data
    networks:
      - ensam-network

  absence-db:
    image: postgres:15-alpine
    container_name: absence-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: absence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - absence-db-data:/var/lib/postgresql/data
    networks:
      - ensam-network

  justification-db:
    image: postgres:15-alpine
    container_name: justification-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: justification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - justification-db-data:/var/lib/postgresql/data
    networks:
      - ensam-network

  notification-db:
    image: postgres:15-alpine
    container_name: notification-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - ensam-network

  reporting-db:
    image: postgres:15-alpine
    container_name: reporting-db
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - reporting-db-data:/var/lib/postgresql/data
    networks:
      - ensam-network

volumes:
  user-db-data:
  academic-db-data:
  absence-db-data:
  justification-db-data:
  notification-db-data:
  reporting-db-data:

networks:
  ensam-network:
    driver: bridge
